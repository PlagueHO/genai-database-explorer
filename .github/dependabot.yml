version: 2

# Dependabot configuration for GenAI Database Explorer
updates:
  # .NET dependencies
  - package-ecosystem: "nuget"
    directory: "/genai-database-explorer-service"
    schedule:
      interval: "weekly"
      time: "06:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "nuget"
      - ".net"
    rebase-strategy: "auto"
    groups:
      nuget-dependencies:
        patterns:
          - "*"
    allow:
      - dependency-type: "all"
    ignore:
      - dependency-name: "Microsoft.Agents.AI.OpenAI"
      - dependency-name: "Microsoft.Extensions.VectorData.Abstractions"

  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      time: "06:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "github-actions"
    rebase-strategy: "auto"
    groups:
      gh-actions:
        patterns:
          - "*"
