version: 2

# dependabot-monthly-v1: first day of each month at 09:00 Pacific/Auckland; security updates remain event-driven.
updates:
  # .NET dependencies
  - package-ecosystem: "nuget"
    directory: "/genai-database-explorer-service"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "Pacific/Auckland"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      prefix-development: "deps"
    labels:
      - "dependencies"
      - "nuget"
    rebase-strategy: "auto"
    groups:
      nuget-minor-and-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      nuget-security:
        applies-to: "security-updates"
        patterns:
          - "*"
    allow:
      - dependency-type: "all"
    ignore:
      - dependency-name: "Microsoft.Agents.AI.OpenAI"
      - dependency-name: "Microsoft.Extensions.VectorData.Abstractions"

  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "Pacific/Auckland"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      prefix-development: "deps"
    labels:
      - "dependencies"
      - "github-actions"
    rebase-strategy: "auto"
    groups:
      github-actions-minor-and-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      github-actions-security:
        applies-to: "security-updates"
        patterns:
          - "*"
